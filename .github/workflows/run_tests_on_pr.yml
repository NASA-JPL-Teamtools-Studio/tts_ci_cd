name: PR Multi-Version Tests

on:
  workflow_call:
    inputs:
      package_name:
        description: 'The import name of the Python package (e.g., tts_fresh)'
        required: true
        type: string
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened] 
  push:
  
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: write

jobs:
  test:
    name: Py ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: "1.0.0.dev0"
      PACKAGE_NAME: ${{ inputs.package_name || 'tts_ci_cd' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 1. MODERN PYTHON HANDLING (3.8 to 3.14) ----
      - name: Setup Modern Python
        if: matrix.python-version != '3.6' && matrix.python-version != '3.7'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Test Modern Python
        if: matrix.python-version != '3.6' && matrix.python-version != '3.7'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-html pytest-cov setuptools-scm
          pip install .
          pytest --pyargs $PACKAGE_NAME \
            --html=report-${{ matrix.python-version }}.html --self-contained-html \
            --junitxml=results-${{ matrix.python-version }}.xml \
            --cov=$PACKAGE_NAME \
            --cov-report=term \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml \
            --cov-report=html:coverage-html-${{ matrix.python-version }}

      # ---- 2. LEGACY PYTHON HANDLING (3.6 and 3.7) ----
      - name: Test Legacy Python in Docker
        if: matrix.python-version == '3.6' || matrix.python-version == '3.7'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            -e SETUPTOOLS_SCM_PRETEND_VERSION="1.0.0.dev0" \
            -e PACKAGE_NAME="$PACKAGE_NAME" \
            python:${{ matrix.python-version }}-slim \
            bash -c "
              apt-get update && apt-get install -y git && \
              git config --global --add safe.directory /app && \
              if [ '${{ matrix.python-version }}' = '3.6' ]; then
                pip install --upgrade 'pip<21.0' 'setuptools<60.0' wheel && \
                pip install 'pytest<7.0' 'pytest-html<3.0' 'setuptools-scm<7.0' 'pytest-cov<3.0';
              else
                pip install --upgrade 'pip<23.1' 'setuptools<60.0' wheel && \
                pip install 'pytest<8.0' 'pytest-html<4.0' 'setuptools-scm<8.0' 'pytest-cov<4.0';
              fi && \
              pip install . && \
              pytest --pyargs \$PACKAGE_NAME \
                --html=report-${{ matrix.python-version }}.html --self-contained-html \
                --junitxml=results-${{ matrix.python-version }}.xml \
                --cov=\$PACKAGE_NAME \
                --cov-report=term \
                --cov-report=xml:coverage-${{ matrix.python-version }}.xml \
                --cov-report=html:coverage-html-${{ matrix.python-version }}
            "
          
          sudo chown -R $USER:$USER "$GITHUB_WORKSPACE"

      # ---- 3. UPLOAD REPORTS & DATA ----
      - name: Upload Test and Coverage Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-py${{ matrix.python-version }}
          path: |
            report-${{ matrix.python-version }}.html
            results-${{ matrix.python-version }}.xml
            coverage-${{ matrix.python-version }}.xml
            coverage-html-${{ matrix.python-version }}/
          retention-days: 1

      # ---- 4. SAVE STATUS FOR PR COMMENT ----
      - name: Save Job Status
        if: always()
        run: |
          echo "${{ matrix.python-version }}|${{ job.status }}" > status-${{ matrix.python-version }}.txt

      - name: Upload Job Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-py${{ matrix.python-version }}
          path: status-${{ matrix.python-version }}.txt
          retention-days: 1

  # ---- 5. AGGREGATE RESULTS & POST COMMENT ----
  comment:
    name: Post PR Comment
    needs: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download Status Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: status-py*
          merge-multiple: true

      - name: Generate Markdown Table
        run: |
          echo "### 🧪 Python Multi-Version Test Results" > pr_message.md
          echo "" >> pr_message.md
          echo "| Python Version | Status | Test Report | Coverage Dashboard |" >> pr_message.md
          echo "|---|---|---|---|" >> pr_message.md

          for file in $(ls status-*.txt | sort -V); do
            IFS='|' read -r version status < "$file"
            if [ "$status" = "success" ]; then
              icon="✅ Passed"
            else
              icon="❌ Failed"
            fi
            
            # Base URL for GitHub Pages
            base_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}"
            
            echo "| **$version** | $icon | [View Tests]($base_url/report-$version.html) | [View Coverage]($base_url/coverage-html-$version/index.html) |" >> pr_message.md
          done

          echo "" >> pr_message.md
          echo "- [View Full Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> pr_message.md

      - name: Post Status Comment via Native GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file pr_message.md --repo ${{ github.repository }}

  # ---- 6. PUBLISH TO GITHUB PAGES ----
  publish-reports:
    name: Publish to gh-pages
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-artifacts-py*
          path: incoming-reports
          merge-multiple: true

      - name: Set Target Directory
        id: paths
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dest_dir=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          else
            echo "dest_dir=main" >> $GITHUB_ENV
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: incoming-reports
          target-folder: ${{ env.dest_dir }}
          clean: false
          single-commit: true