name: PR Multi-Version Tests

on:
  workflow_call:
    inputs:
      package_name:
        description: 'The import name of the Python package'
        required: true
        type: string
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened] 
  push:
    branches: [ main ]
  
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: write

jobs:
  test:
    name: Py ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: "1.0.0.dev0"
      # Fallback to tts_ci_cd if input isn't provided
      PACKAGE_NAME: ${{ inputs.package_name || 'tts_ci_cd' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 1. MODERN PYTHON HANDLING (3.8 to 3.14) ----
      - name: Setup Modern Python
        if: matrix.python-version != '3.6' && matrix.python-version != '3.7'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Test & Audit (Modern)
        if: matrix.python-version != '3.6' && matrix.python-version != '3.7'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-html pytest-cov setuptools-scm bandit pip-audit
          pip install .
          
          mkdir -p artifacts/html artifacts/machine
          
          # Security Scanning
          bandit -r src/ -f html -o artifacts/html/security-report-${{ matrix.python-version }}.html || true
          bandit -r src/ -f xml -o artifacts/machine/security-results-${{ matrix.python-version }}.xml || true
          
          # Pip Audit to JSON then convert via your custom CLI
          pip-audit -f json -o artifacts/machine/security-audit-${{ matrix.python-version }}.json || true
          tts-pip-audit-report artifacts/machine/security-audit-${{ matrix.python-version }}.json artifacts/html/security-audit-${{ matrix.python-version }}.html
          
          # Testing
          INSTALLED_PATH=$(python -c "import $PACKAGE_NAME; import os; print(os.path.dirname($PACKAGE_NAME.__file__))")
          pytest --pyargs $PACKAGE_NAME \
            --html=artifacts/html/report-${{ matrix.python-version }}.html --self-contained-html \
            --junitxml=artifacts/machine/results-${{ matrix.python-version }}.xml \
            --cov="$INSTALLED_PATH" \
            --cov-report=term \
            --cov-report=xml:artifacts/machine/coverage-${{ matrix.python-version }}.xml \
            --cov-report=html:artifacts/html/coverage-html-${{ matrix.python-version }}

      # ---- 2. LEGACY PYTHON HANDLING (3.6 and 3.7) ----
      - name: Test & Audit (Legacy)
        if: matrix.python-version == '3.6' || matrix.python-version == '3.7'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            -e SETUPTOOLS_SCM_PRETEND_VERSION="1.0.0.dev0" \
            -e PACKAGE_NAME="$PACKAGE_NAME" \
            python:${{ matrix.python-version }}-slim \
            bash -c "
              apt-get update && apt-get install -y git && \
              git config --global --add safe.directory /app && \
              mkdir -p artifacts/html artifacts/machine && \
              if [ '${{ matrix.python-version }}' = '3.6' ]; then
                pip install --upgrade 'pip<21.0' 'setuptools<60.0' wheel && \
                pip install 'pytest<7.0' 'pytest-html<3.0' 'setuptools-scm<7.0' 'pytest-cov<3.0' 'bandit<1.7.3' 'pip-audit';
              else
                pip install --upgrade 'pip<23.1' 'setuptools<60.0' wheel && \
                pip install 'pytest<8.0' 'pytest-html<4.0' 'setuptools-scm<8.0' 'pytest-cov<4.0' 'bandit<1.7.5' 'pip-audit';
              fi && \
              pip install . && \
              bandit -r src/ -f html -o artifacts/html/security-report-${{ matrix.python-version }}.html || true && \
              bandit -r src/ -f xml -o artifacts/machine/security-results-${{ matrix.python-version }}.xml || true && \
              pip-audit -f json -o artifacts/machine/security-audit-${{ matrix.python-version }}.json || true && \
              tts-pip-audit-report artifacts/machine/security-audit-${{ matrix.python-version }}.json artifacts/html/security-audit-${{ matrix.python-version }}.html && \
              INSTALLED_PATH=\$(python -c \"import \$PACKAGE_NAME; import os; print(os.path.dirname(\$PACKAGE_NAME.__file__))\") && \
              pytest --pyargs \$PACKAGE_NAME \
                --html=artifacts/html/report-${{ matrix.python-version }}.html --self-contained-html \
                --junitxml=artifacts/machine/results-${{ matrix.python-version }}.xml \
                --cov=\"\$INSTALLED_PATH\" \
                --cov-report=term \
                --cov-report=xml:artifacts/machine/coverage-${{ matrix.python-version }}.xml \
                --cov-report=html:artifacts/html/coverage-html-${{ matrix.python-version }}
            "
          sudo chown -R $USER:$USER "$GITHUB_WORKSPACE"

      # ---- 3. UPLOAD ARTIFACTS ----
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-py${{ matrix.python-version }}
          path: artifacts/
          retention-days: 1

      # ---- 4. STATUS HANDLING ----
      - name: Save Job Status
        if: always()
        run: echo "${{ matrix.python-version }}|${{ job.status }}" > status-${{ matrix.python-version }}.txt

      - name: Upload Job Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-py${{ matrix.python-version }}
          path: status-${{ matrix.python-version }}.txt
          retention-days: 1

  # ---- 5. PR COMMENT AGGREGATION ----
  comment:
    name: Post PR Comment
    needs: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download Status Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: status-py*
          merge-multiple: true

      - name: Generate Markdown Table
        run: |
          echo "### 🧪 Python CI/CD Results" > pr_message.md
          echo "" >> pr_message.md
          echo "| Version | Status | Tests | Coverage | Security | Audit |" >> pr_message.md
          echo "|---|---|---|---|---|---|" >> pr_message.md

          for file in $(ls status-*.txt | sort -V); do
            IFS='|' read -r version status < "$file"
            icon=$([ "$status" = "success" ] && echo "✅" || echo "❌")
            base_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/html"
            
            echo "| **$version** | $icon | [Tests]($base_url/report-$version.html) | [Coverage]($base_url/coverage-html-$version/index.html) | [Bandit]($base_url/security-report-$version.html) | [Audit]($base_url/security-audit-$version.html) |" >> pr_message.md
          done
          
          gh pr comment ${{ github.event.pull_request.number }} --body-file pr_message.md --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- 6. DEPLOY TO PAGES ----
  publish-reports:
    name: Publish to gh-pages
    needs: test
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-artifacts-py*
          path: incoming-reports
          merge-multiple: true
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: incoming-reports
          target-folder: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          clean: false
          single-commit: true